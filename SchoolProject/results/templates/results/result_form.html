{% extends "base.html" %} {% block title %}Result Form{% endblock %} {% block content %}

<div class="form-container">

    <h1>Add Student Result</h1>

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">
            <label>Student</label> {{ form.student }}
        </div>

        <div class="form-group">
            <label>Subject</label> {{ form.subject }}
        </div>

        <div class="form-group">
            <label>Exam</label> {{ form.exam }}
        </div>

        <div class="form-group">
            <label>Marks</label> {{ form.marks }}
        </div>

        <div class="form-group">
            <label>Grade</label> {{ form.grade }}
        </div>

        <button type="submit" class="btn">
            Save Result
        </button>

        <a href="{% url 'result_list' %}" class="btn-secondary">

            Cancel

        </a>

    </form>

</div>

{% endblock %}
