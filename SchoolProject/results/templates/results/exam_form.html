{% extends "base.html" %} {% block title %}Exam Form{% endblock %} {% block content %}

<div class="form-container">

    <h1>Create Exam</h1>

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">
            <label>Exam Name</label> {{ form.name }}
        </div>

        <div class="form-group">
            <label>Exam Date</label> {{ form.date }}
        </div>

        <button type="submit" class="btn">
            Save Exam
        </button>

        <a href="{% url 'exam_list' %}" class="btn-secondary">

            Cancel

        </a>

    </form>

</div>

{% endblock %}
