<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Student</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #f1f4f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .delete-container {
            width: 450px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            text-align: center;
        }
        
        .delete-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            background: #f8d7da;
            color: #dc3545;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        
        .delete-container h1 {
            color: #212529;
            margin-bottom: 12px;
            font-size: 26px;
        }
        
        .warning {
            color: #666;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        
        .student-info {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 25px;
            text-align: left;
        }
        
        .student-info p {
            margin-bottom: 8px;
            color: #444;
        }
        
        .student-info p:last-child {
            margin-bottom: 0;
        }
        
        .student-info strong {
            color: #212529;
        }
        
        .button-group {
            display: flex;
            gap: 12px;
        }
        
        .delete-btn {
            flex: 1;
            border: none;
            padding: 12px;
            background: #dc3545;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        
        .delete-btn:hover {
            background: #bb2d3b;
        }
        
        .cancel-btn {
            flex: 1;
            padding: 12px;
            background: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
        }
        
        .cancel-btn:hover {
            background: #5c636a;
        }
        
        @media (max-width: 500px) {
            .delete-container {
                width: 90%;
                padding: 25px;
            }
            .button-group {
                flex-direction: column;
            }
        }
    </style>

</head>

<body>


    <div class="delete-container">


        <!-- Delete Icon -->

        <div class="delete-icon">
            ⚠
        </div>


        <!-- Heading -->

        <h1>
            Delete Student?
        </h1>


        <p class="warning">

            Are you sure you want to delete this student?

            <br> This action cannot be undone.

        </p>


        <!-- Student Information -->

        <div class="student-info">

            <p>
                <strong>Name:</strong> {{ student.name }}
            </p>

            <p>
                <strong>Roll No:</strong> {{ student.roll_no }}
            </p>

            <p>
                <strong>Email:</strong> {{ student.email }}
            </p>

            <p>
                <strong>Phone:</strong> {{ student.phone }}
            </p>

        </div>


        <!-- Buttons -->

        <form method="POST">

            {% csrf_token %}

            <div class="button-group">

                <button type="submit" class="delete-btn">

                Yes, Delete

            </button>


                <a href="{% url 'student' %}" class="cancel-btn">

                Cancel

            </a>

            </div>

        </form>


    </div>


</body>

</html>
