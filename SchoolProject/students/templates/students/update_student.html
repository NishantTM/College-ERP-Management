<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Student | School ERP</title>


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #333;
        }
        /* =========================
           HEADER
        ========================== */
        
        .header {
            background: #1f2937;
            color: white;
            padding: 18px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 22px;
            font-weight: bold;
        }
        
        .header-text {
            font-size: 14px;
            color: #d1d5db;
        }
        /* =========================
           MAIN CONTAINER
        ========================== */
        
        .main-container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
        }
        /* =========================
           PAGE HEADER
        ========================== */
        
        .page-header {
            margin-bottom: 25px;
        }
        
        .page-header h1 {
            font-size: 30px;
            color: #1f2937;
            margin-bottom: 8px;
        }
        
        .page-header p {
            color: #6b7280;
            font-size: 15px;
        }
        /* =========================
           FORM CARD
        ========================== */
        
        .form-card {
            background: white;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }
        
        .form-title {
            font-size: 20px;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e5e7eb;
        }
        /* =========================
           FORM GRID
        ========================== */
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .full-width {
            grid-column: 1 / -1;
        }
        
        .form-group label {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
            color: #374151;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
            font-family: Arial, sans-serif;
        }
        
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        
        .form-group textarea {
            height: 110px;
            resize: vertical;
        }
        /* =========================
           BUTTONS
        ========================== */
        
        .button-section {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }
        
        .btn {
            padding: 11px 22px;
            border-radius: 7px;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        
        .update-btn {
            background: #2563eb;
            color: white;
        }
        
        .update-btn:hover {
            background: #1d4ed8;
        }
        
        .cancel-btn {
            background: #6b7280;
            color: white;
        }
        
        .cancel-btn:hover {
            background: #4b5563;
        }
        /* =========================
           FOOTER
        ========================== */
        
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #9ca3af;
            font-size: 13px;
        }
        /* =========================
           RESPONSIVE
        ========================== */
        
        @media (max-width: 700px) {
            .header {
                padding: 15px 20px;
            }
            .main-container {
                width: 94%;
                margin: 25px auto;
            }
            .form-card {
                padding: 22px;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .full-width {
                grid-column: auto;
            }
            .button-section {
                flex-direction: column;
            }
            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <div class="logo">
            School ERP
        </div>

        <div class="header-text">
            Student Management System
        </div>

    </header>



    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="main-container">


        <div class="page-header">

            <h1>
                Update Student
            </h1>

            <p>
                Edit and update student information
            </p>

        </div>



        <!-- FORM CARD -->

        <div class="form-card">

            <div class="form-title">
                Student Information
            </div>


            <form method="POST">

                {% csrf_token %}


                <div class="form-grid">


                    <!-- NAME -->

                    <div class="form-group">

                        <label for="name">
                            Student Name
                        </label>

                        <input type="text" id="name" name="name" value="{{ student.name }}" placeholder="Enter student name" required>

                    </div>



                    <!-- ROLL NUMBER -->

                    <div class="form-group">

                        <label for="roll_no">
                            Roll Number
                        </label>

                        <input type="number" id="roll_no" name="roll_no" value="{{ student.roll_no }}" placeholder="Enter roll number" required>

                    </div>



                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input type="email" id="email" name="email" value="{{ student.email }}" placeholder="Enter email address" required>

                    </div>



                    <!-- PHONE -->

                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input type="text" id="phone" name="phone" value="{{ student.phone }}" placeholder="Enter phone number" required>

                    </div>



                    <!-- ADDRESS -->

                    <div class="form-group full-width">

                        <label for="address">
                            Address
                        </label>

                        <textarea id="address" name="address" placeholder="Enter student address" required>{{ student.address }}</textarea>

                    </div>


                </div>



                <!-- BUTTONS -->

                <div class="button-section">


                    <a href="{% url 'student' %}" class="btn cancel-btn">

                        Cancel

                    </a>


                    <button type="submit" class="btn update-btn">

                        Update Student

                    </button>


                </div>


            </form>

        </div>


        <!-- FOOTER -->

        <div class="footer">

            © 2026 School ERP Management System

        </div>


    </main>


</body>

</html>
