<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Student</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }
        
        .container {
            width: 450px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }
        
        h1 {
            text-align: center;
        }
        
        label {
            display: block;
            margin-top: 15px;
        }
        
        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }
        
        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
        }
        
        button:hover {
            background: #555;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Registration</h1>

        <form method="POST">

            {% csrf_token %}

            <label>Name</label>
            <input type="text" name="name" required>

            <label>Roll Number</label>
            <input type="number" name="roll_no" required>

            <label>Address</label>
            <textarea name="address" required></textarea>

            <label>Email</label>
            <input type="email" name="email" required>

            <label>Phone</label>
            <input type="text" name="phone" required>

            <button type="submit">
                Add Student
            </button>

        </form>

    </div>

</body>

</html>
