{% extends "base.html" %} {% block title %}Attendance Form{% endblock %} {% block content %}

<div class="form-container">

    <h1>Mark Attendance</h1>

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">

            <label>Student</label> {{ form.student }}

        </div>


        <div class="form-group">

            <label>Subject</label> {{ form.subject }}

        </div>


        <div class="form-group">

            <label>Date</label> {{ form.date }}

        </div>


        <div class="form-group">

            <label>Status</label> {{ form.status }}

        </div>


        <button type="submit" class="btn">
            Save Attendance
        </button>

        <a href="{% url 'attendance_list' %}" class="btn-secondary">

            Cancel

        </a>

    </form>

</div>

{% endblock %}
