{% extends "base.html" %} {% block title %} Edit Teacher | College ERP {% endblock %} {% block content %}

<div class="form-container">

    <div class="page-title">

        <h1>Edit Teacher</h1>

        <p>
            Update teacher information.
        </p>

    </div>


    <div class="form-card">

        <div class="teacher-id">
            Teacher ID: #{{ teacher.id }}
        </div>


        <form method="POST">

            {% csrf_token %}

            <div class="form-grid">

                <div class="form-group">

                    <label>Full Name</label>

                    <input type="text" name="name" value="{{ teacher.name }}" required>

                </div>


                <div class="form-group">

                    <label>Email Address</label>

                    <input type="email" name="email" value="{{ teacher.email }}" required>

                </div>


                <div class="form-group">

                    <label>Phone Number</label>

                    <input type="text" name="phone" value="{{ teacher.phone }}" required>

                </div>


                <div class="form-group">

                    <label>Subject</label>

                    <input type="text" name="subject" value="{{ teacher.subject }}" required>

                </div>


                <div class="form-group full">

                    <label>Address</label>

                    <textarea name="address" required>{{ teacher.address }}</textarea>

                </div>

            </div>


            <div class="actions">

                <a href="{% url 'teacher_list' %}" class="btn cancel-btn">
                    Cancel
                </a>

                <button type="submit" class="btn update-btn">
                    Update Teacher
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
