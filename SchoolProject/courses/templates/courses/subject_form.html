{% extends "base.html" %} {% block title %}Subject Form{% endblock %} {% block content %}

<div class="form-container">

    <h1>Add Subject</h1>

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">
            <label>Course</label> {{ form.course }}
        </div>

        <div class="form-group">
            <label>Subject Name</label> {{ form.name }}
        </div>

        <div class="form-group">
            <label>Subject Code</label> {{ form.code }}
        </div>

        <div class="form-group">
            <label>Semester</label> {{ form.semester }}
        </div>

        <div class="form-group">
            <label>Credit Hours</label> {{ form.credit_hours }}
        </div>

        <button type="submit" class="btn">
            Save Subject
        </button>

        <a href="{% url 'subject_list' %}" class="btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
