{% extends "base.html" %} {% block title %}Course Form{% endblock %} {% block content %}

<div class="form-container">

    <h1>Add Course</h1>

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">
            <label>Course Name</label> {{ form.name }}
        </div>

        <div class="form-group">
            <label>Course Code</label> {{ form.code }}
        </div>

        <div class="form-group">
            <label>Duration</label> {{ form.duration }}
        </div>

        <div class="form-group">
            <label>Description</label> {{ form.description }}
        </div>

        <button type="submit" class="btn">
            Save Course
        </button>

        <a href="{% url 'course_list' %}" class="btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
