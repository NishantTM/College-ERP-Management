<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Teacher | School ERP</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            color: #212529;
        }
        
        .navbar {
            background: #1f2937;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 22px;
            font-weight: bold;
        }
        
        .logo span {
            color: #60a5fa;
        }
        
        .nav-links {
            display: flex;
            gap: 25px;
        }
        
        .nav-links a {
            color: #d1d5db;
            text-decoration: none;
            font-size: 14px;
        }
        
        .nav-links a:hover {
            color: white;
        }
        
        .container {
            width: 90%;
            max-width: 900px;
            margin: 45px auto;
        }
        
        .page-title {
            margin-bottom: 25px;
        }
        
        .page-title h1 {
            font-size: 30px;
            margin-bottom: 7px;
        }
        
        .page-title p {
            color: #6b7280;
        }
        
        .form-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 30px;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .full {
            grid-column: 1 / -1;
        }
        
        label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        input,
        textarea {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        
        input:focus,
        textarea:focus {
            border-color: #2563eb;
        }
        
        textarea {
            min-height: 110px;
            resize: vertical;
        }
        
        .actions {
            margin-top: 28px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        
        .btn {
            padding: 11px 20px;
            border-radius: 6px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        
        .cancel-btn {
            background: #e5e7eb;
            color: #374151;
        }
        
        .save-btn {
            background: #2563eb;
            color: white;
        }
        
        .save-btn:hover {
            background: #1d4ed8;
        }
        
        footer {
            text-align: center;
            padding: 25px;
            color: #6b7280;
            font-size: 13px;
        }
        
        @media (max-width: 700px) {
            .nav-links {
                display: none;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .full {
                grid-column: auto;
            }
        }
    </style>

</head>

<body>


    <nav class="navbar">

        <div class="logo">
            School<span>ERP</span>
        </div>

        <div class="nav-links">

            <a href="{% url 'student' %}">
            Students
        </a>

            <a href="{% url 'teacher' %}">
            Teachers
        </a>

            <a href="#">
            Classes
        </a>

            <a href="#">
            Attendance
        </a>

            <a href="#">
            Fees
        </a>

            <a href="#">
            Results
        </a>

        </div>

    </nav>


    <div class="container">

        <div class="page-title">

            <h1>Add Teacher</h1>

            <p>
                Enter the teacher's information below.
            </p>

        </div>


        <div class="form-card">

            <form method="POST">

                {% csrf_token %}

                <div class="form-grid">


                    <div class="form-group">

                        <label>
                        Full Name
                    </label>

                        <input type="text" name="name" placeholder="Enter teacher name" required>

                    </div>


                    <div class="form-group">

                        <label>
                        Email Address
                    </label>

                        <input type="email" name="email" placeholder="teacher@example.com" required>

                    </div>


                    <div class="form-group">

                        <label>
                        Phone Number
                    </label>

                        <input type="text" name="phone" placeholder="Enter phone number" required>

                    </div>


                    <div class="form-group">

                        <label>
                        Subject
                    </label>

                        <input type="text" name="subject" placeholder="e.g. Mathematics" required>

                    </div>


                    <div class="form-group full">

                        <label>
                        Address
                    </label>

                        <textarea name="address" placeholder="Enter teacher address" required></textarea>

                    </div>


                </div>


                <div class="actions">

                    <a href="{% url 'teacher' %}" class="btn cancel-btn">
                    Cancel
                </a>

                    <button type="submit" class="btn save-btn">
                    Save Teacher
                </button>

                </div>

            </form>

        </div>

    </div>


    <footer>

        © 2026 School ERP Management System

    </footer>


</body>

</html>
