{% extends "base.html" %} {% block title %}Fee Form{% endblock %} {% block content %}

<div class="form-container">

    <h1>Add Fee Record</h1>

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">

            <label>Student</label> {{ form.student }}

        </div>


        <div class="form-group">

            <label>Total Amount</label> {{ form.amount }}

        </div>


        <div class="form-group">

            <label>Paid Amount</label> {{ form.paid_amount }}

        </div>


        <div class="form-group">

            <label>Due Date</label> {{ form.due_date }}

        </div>


        <div class="form-group">

            <label>Status</label> {{ form.status }}

        </div>


        <button type="submit" class="btn">
            Save Fee
        </button>


        <a href="{% url 'fee_list' %}" class="btn-secondary">

            Cancel

        </a>

    </form>

</div>

{% endblock %}
